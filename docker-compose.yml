# Stripe Polyglot - Stack locale (dev uniquement)
# Stack : PostgreSQL 16 + MongoDB 7 + Kafka 7.6 + Debezium 2.6 + Redis 7 + Flink 1.18 (PyFlink)

name: stripe-polyglot

services:
  # ─────────────────────────────────────────────────────────
  # PostgreSQL (OLTP)
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-bookworm
    container_name: stripe-postgres
    environment:
      POSTGRES_DB: ${PG_DB:-stripe_oltp}
      POSTGRES_USER: ${PG_USER:-stripe_app}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?must be set in .env}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --encoding=UTF-8 --locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=5"
      - "-c"
      - "max_wal_senders=5"
      - "-c"
      - "shared_preload_libraries="
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-stripe_app} -d ${PG_DB:-stripe_oltp}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # MongoDB (logs / features)
  # ─────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: stripe-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?must be set in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-stripe_nosql}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./init/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # Kafka (KRaft mode, no Zookeeper)
  # ─────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: stripe-kafka
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9101:9101"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      # Double listener indispensable en local :
      # - kafka:9092 pour les conteneurs
      # - localhost:29092 pour les scripts Python host.
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # Debezium Connect (CDC)
  # ─────────────────────────────────────────────────────────
  debezium:
    image: debezium/connect:2.6
    container_name: stripe-debezium
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: stripe-connect
      # Ces topics internes Connect doivent rester persistants pour reprendre
      # correctement les offsets en cas de redémarrage de la stack.
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      OFFSET_FLUSH_INTERVAL_MS: 1000
    volumes:
      - debezium-data:/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # Redis (feature store online)
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stripe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes
        else
          echo 'REDIS_PASSWORD not set'
          exit 1
        fi
      "
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?must be set in .env}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # Streamlit (dashboard de démo)
  # ─────────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: stripe-dashboard:latest
    container_name: stripe-dashboard
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: ${PG_DB:-stripe_oltp}
      PG_USER: ${PG_USER:-stripe_app}
      PG_PASSWORD: ${PG_PASSWORD:?must be set in .env}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:-admin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?must be set in .env}
      MONGO_DB: ${MONGO_DB:-stripe_nosql}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?must be set in .env}
      FRAUD_SCORE_THRESHOLD: ${FRAUD_SCORE_THRESHOLD:-0.85}
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # Apache Flink (JobManager) — OPTIONNEL, profil "flink"
  # Note: Sur Mac M-series ARM64, l'image PyFlink custom a des soucis de build.
  #       Pour la démo, on utilise un job Python "Flink-like" (producers/flink_like_job.py)
  #       qui tourne sur la machine host et fait la même logique.
  #       Activez ce service uniquement en prod avec `docker compose --profile flink up`
  # ─────────────────────────────────────────────────────────
  flink-jobmanager:
    profiles: ["flink"]
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: stripe-flink-pyflink:1.18
    container_name: stripe-flink-jobmanager
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        jobmanager.heap.size: 1024m
        taskmanager.heap.size: 1024m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
        rest.address: 0.0.0.0
        rest.port: 8081
        state.backend: filesystem
        state.checkpoints.dir: file:///tmp/flink-data/checkpoints
        state.savepoints.dir: file:///tmp/flink-data/savepoints
        execution.checkpointing.interval: 30s
      KAFKA_BROKERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?must be set in .env}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:-admin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?must be set in .env}
      MONGO_DB: ${MONGO_DB:-stripe_nosql}
      FRAUD_SCORE_THRESHOLD: ${FRAUD_SCORE_THRESHOLD:-0.85}
    volumes:
      - flink-data:/tmp/flink-data
    command: jobmanager
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # MLflow — tracking des runs d'entraînement + registre de modèles
  # ─────────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: stripe-mlflow
    ports:
      # Host 5001 : le port 5000 est souvent pris par AirPlay Receiver sur macOS
      # (Réglages Système > Général > AirDrop et Handoff, à désactiver si besoin
      # de libérer 5000). Le conteneur écoute toujours sur 5000 en interne.
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow
    # Backend SQLite + artefacts sur disque : suffisant pour une démo mono-nœud,
    # pas destiné à supporter des écritures concurrentes à l'échelle (en prod :
    # backend Postgres partagé + artifact store S3/GCS).
    #
    # --serve-artifacts + --artifacts-destination (plutôt que --default-artifact-root
    # seul) : les clients (host macOS ou autres conteneurs) uploadent/téléchargent
    # les artefacts via l'API HTTP du serveur (URIs mlflow-artifacts:/...) au lieu
    # d'écrire directement sur le chemin /mlflow — qui n'existe que DANS ce
    # conteneur. Sans ça, un client hors conteneur plante avec "Read-only file
    # system: /mlflow" en essayant d'écrire sur un chemin qui n'est pas le sien.
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # ML Monitor — Evidently (drift + perf) + déclenchement auto du réentraînement
  # ─────────────────────────────────────────────────────────
  ml-monitor:
    build:
      context: .
      dockerfile: ml/Dockerfile
    image: stripe-ml-monitor:latest
    container_name: stripe-ml-monitor
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: ${PG_DB:-stripe_oltp}
      PG_USER: ${PG_USER:-stripe_app}
      PG_PASSWORD: ${PG_PASSWORD:?must be set in .env}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:-admin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?must be set in .env}
      MONGO_DB: ${MONGO_DB:-stripe_nosql}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Intervalle entre 2 checks de drift/performance — assez court pour la démo,
      # à espacer largement en prod (ex. toutes les heures).
      ML_MONITOR_INTERVAL_SECONDS: ${ML_MONITOR_INTERVAL_SECONDS:-120}
      ML_DRIFT_THRESHOLD: ${ML_DRIFT_THRESHOLD:-0.3}
      ML_MIN_RECALL: ${ML_MIN_RECALL:-0.7}
    volumes:
      # Le scorer (producers/flink_like_job.py) tourne sur le host via venv,
      # pas dans Docker — ce bind mount fait pointer les deux sur le même
      # fichier .pkl pour qu'un réentraînement déclenché ici soit effectivement
      # celui que le scorer host chargera à son prochain démarrage.
      - ./ml/models:/app/ml/models
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # Apache Airflow — OPTIONNEL, profil "airflow"
  # Orchestration du batch ETL Snowflake (dags/stripe_daily_etl.py), en
  # remplacement du script cron. Profil optionnel (comme Flink) car le mode
  # "standalone" reste gourmand en mémoire pour ce qu'il orchestre ici — deux
  # tâches BashOperator, pas besoin d'un cluster Airflow complet pour la démo.
  # ─────────────────────────────────────────────────────────
  airflow:
    profiles: ["airflow"]
    image: apache/airflow:2.9.3-python3.11
    container_name: stripe-airflow
    ports:
      # Host 8090 : 8080 est déjà pris par un autre stack Airflow sur cette machine.
      - "8090:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # _PIP_ADDITIONAL_REQUIREMENTS : mécanisme officiel pour du dev/démo
      # uniquement (réinstalle à chaque démarrage) — pas fait pour la prod, où
      # on construirait une image Airflow dédiée avec ces deps figées au build.
      _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary==2.9.9 snowflake-connector-python==3.6.0 python-dotenv==1.0.0"
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: ${PG_DB:-stripe_oltp}
      PG_USER: ${PG_USER:-stripe_app}
      PG_PASSWORD: ${PG_PASSWORD:?must be set in .env}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-STRIPE_WH}
      SNOWFLAKE_DB: ${SNOWFLAKE_DB:-STRIPE_DWH}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-PROD}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      # etl/*.py font `import _env` en s'attendant à le trouver à la racine
      # du projet (parent.parent du fichier) — ici /opt/airflow, pour matcher
      # la structure attendue sans dupliquer la logique de chargement du .env.
      - ./_env.py:/opt/airflow/_env.py
      - airflow-data:/opt/airflow
    depends_on:
      postgres:
        condition: service_healthy
    # standalone : initialise la DB (SQLite), crée un admin, lance
    # webserver+scheduler+triggerer dans un seul process — suffisant pour une
    # démo mono-nœud, pas pour un vrai déploiement multi-worker.
    command: standalone
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # Apache Flink (TaskManager) — OPTIONNEL, profil "flink"
  # ─────────────────────────────────────────────────────────
  flink-taskmanager:
    profiles: ["flink"]
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: stripe-flink-pyflink:1.18
    container_name: stripe-flink-taskmanager
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.heap.size: 1024m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
      KAFKA_BROKERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?must be set in .env}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: ${MONGO_USER:-admin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?must be set in .env}
      MONGO_DB: ${MONGO_DB:-stripe_nosql}
      FRAUD_SCORE_THRESHOLD: ${FRAUD_SCORE_THRESHOLD:-0.85}
    volumes:
      - flink-data:/tmp/flink-data
    command: taskmanager
    restart: unless-stopped

# ─────────────────────────────────────────────────────────
# Volumes (named volumes pour contourner les bugs virtiofs sur macOS)
# ─────────────────────────────────────────────────────────
volumes:
  postgres-data:
  mongo-data:
  redis-data:
  kafka-data:
  debezium-data:
  flink-data:
  mlflow-data:
  airflow-data:
